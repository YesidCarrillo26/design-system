name: Preparar entorno
description: >-
  Instala Node y pnpm, las dependencias y construye los tokens. Lo usan los workflows de los
  agentes remotos (ver docs/adr/0004-agentes-remotos.md) para que el agente arranque con el
  entorno listo. Requiere `actions/checkout` antes.

inputs:
  playwright:
    description: Instala Chromium para las pruebas de Storybook (`test:storybook`).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Typecheck, tests y Storybook dependen de `tokens/dist`.
    - run: pnpm --filter @chroma-yesid/tokens build
      shell: bash

    - if: inputs.playwright == 'true'
      run: pnpm --filter @chroma-yesid/storybook-web exec playwright install --with-deps chromium
      shell: bash
