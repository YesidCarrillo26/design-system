name: Claude

# Adaptador de Claude para los agentes remotos (ver docs/adr/0004-agentes-remotos.md).
#   - Etiqueta `claude` en un issue: Claude crea la rama, implementa y abre el PR.
#   - `@claude` en un comentario de issue o PR: Claude responde o corrige en esa misma rama.
# Las reglas de trabajo están en la sección "Modo remoto" de AGENTS.md.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Dos condiciones de confianza, porque el agente lee texto que no controlas:
    #   1. Quien dispara (etiqueta o comenta) es propietario, miembro o colaborador. Además, la
    #      Action comprueba que tenga permiso de escritura.
    #   2. Quien escribió el issue o el PR también lo es (o es `claude[bot]`, para poder pedirle
    #      ajustes en sus propios PR). Así no procesa un issue o un PR de un externo aunque lo etiquetes.
    # Los comentarios de terceros dentro de un issue propio sí llegan al contexto: revísalos antes.
    if: |
      (github.event_name == 'issues' &&
        github.event.label.name == 'claude' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
          github.event.issue.user.login == 'claude[bot]')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          github.event.pull_request.user.login == 'claude[bot]')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          github.event.pull_request.user.login == 'claude[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A nivel de job (no de workflow): un evento que el `if` descarta no entra en el grupo ni
    # desplaza a un `@claude` que esté esperando. Un solo Claude a la vez por issue o PR.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # La Action lo usa para obtener el token de la Claude GitHub App.
      actions: read # Para leer los logs de `verify` cuando falla.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/preparar-entorno

      # No pasar `github_token`: la Action usa el token de la Claude GitHub App y así los push y los
      # PR sí disparan `verify`. Con `GITHUB_TOKEN` el PR quedaría BLOCKED (errores-y-soluciones.md).
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          label_trigger: claude
          branch_prefix: claude/
          branch_name_template: '{{prefix}}{{entityType}}-{{entityNumber}}-{{description}}'
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Bash(pnpm:*),Bash(npx publint:*),Bash(npx attw:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git fetch:*),Bash(git rebase:*),Bash(git switch:*),Bash(git checkout:*),Bash(git restore:*),Bash(git mv:*),Bash(git rm:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(pnpm publish:*),Bash(pnpm release:*),Bash(npm publish:*),Bash(pnpm changeset publish:*),Bash(pnpm dlx:*),Bash(pnpm create:*),Edit(.github/workflows/**),Write(.github/workflows/**)"
            --append-system-prompt "Estás en GitHub Actions y no hay nadie delante. Sigue la sección Modo remoto de AGENTS.md. Al terminar abre tú el PR con gh pr create (esto reemplaza la instrucción de dejar solo un enlace) y pon el enlace del PR en tu comentario. Cuando te lo pidan puedes rebasar tu propia rama con git rebase origin/main y git push --force-with-lease. Nunca fusiones un PR."
