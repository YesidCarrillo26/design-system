name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dependencias sin usar (knip)
        run: pnpm knip

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Tests unitarios
        run: pnpm turbo run test:unit

      - name: Build
        run: pnpm turbo run build

      - name: Tamaño del paquete (size-limit)
        working-directory: packages/ui
        run: pnpm size

      - name: Calidad del paquete (publint + attw)
        working-directory: packages/ui
        run: |
          npx publint
          pnpm check:peers
          npx attw --pack . --profile esm-only --exclude-entrypoints web.css native.css

      - name: Tests de Storybook (navegador)
        run: |
          pnpm --filter @chroma-yesid/storybook-web exec playwright install --with-deps chromium
          pnpm turbo run test:storybook

      - name: Tests native (Jest)
        run: pnpm turbo run test:native

      - name: Storybook native en el navegador (build + bundle solo native)
        run: |
          pnpm turbo run build-storybook --filter=@chroma-yesid/storybook-native-web
          pnpm --filter @chroma-yesid/storybook-native-web check:bundle

      - name: La web no debe traer react-native
        run: "! grep -rlE 'from.?.react-native.' examples/next-app/.next/static"
