name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dependencias sin usar (knip)
        run: pnpm knip

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Tests unitarios
        run: pnpm turbo run test:unit

      - name: Build
        run: pnpm turbo run build

      - name: Calidad del paquete (publint + attw)
        working-directory: packages/ui
        run: |
          npx publint
          npx attw --pack . --profile esm-only --exclude-entrypoints web.css native.css

      - name: Tests de Storybook (navegador)
        run: |
          pnpm --filter @yesid/storybook-web exec playwright install --with-deps chromium
          pnpm turbo run test:storybook

      - name: Tests native (Jest)
        run: pnpm turbo run test:native

      - name: Storybook native en el navegador (build + bundle solo native)
        run: |
          pnpm turbo run build-storybook --filter=@yesid/storybook-native-web
          pnpm --filter @yesid/storybook-native-web check:bundle

      - name: La web no debe traer react-native
        run: "! grep -rlE 'from.?.react-native.' examples/next-app/.next/static"
