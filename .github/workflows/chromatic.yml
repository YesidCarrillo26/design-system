name: Chromatic

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      # Sin el secret CHROMATIC_PROJECT_TOKEN el job se omite en lugar de fallar.
      HAS_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0 # TurboSnap necesita el historial completo

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.HAS_TOKEN == 'true'

      - run: pnpm --filter @chroma-yesid/tokens build
        if: env.HAS_TOKEN == 'true'

      - uses: chromaui/action@1efa9d9b64308fe98fcf1eb4629f12639ffac902 # latest
        if: env.HAS_TOKEN == 'true'
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook-web
          buildScriptName: build-storybook
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: main
