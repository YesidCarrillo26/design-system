name: Chromatic

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      # Sin el secret CHROMATIC_PROJECT_TOKEN el job se omite en lugar de fallar.
      HAS_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0 # TurboSnap necesita el historial completo

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.HAS_TOKEN == 'true'

      - run: pnpm --filter @yesid/tokens build
        if: env.HAS_TOKEN == 'true'

      - uses: chromaui/action@e50abd573c8a789526f165fec06137a7c21d7299 # latest
        if: env.HAS_TOKEN == 'true'
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook-web
          buildScriptName: build-storybook
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: main
